name: adventure-mods
title: Adventure Mods
summary: Set up Sonic Adventure mods
description: |
  The easiest way to mod Sonic Adventure DX and Sonic Adventure 2 on Linux.
  Finds your Steam installs, downloads community mods, and handles mod
  managers, runtimes, resolution, load order, and language settings so you
  can play right away. Works with a mouse or a controller.
adopt-info: adventure-mods
license: MIT
icon: data/io.github.astrovm.AdventureMods.svg
# The GNOME extension brings Wayland, keyboard layouts, graphics and the file
# chooser portal. It has no core26 version yet.
base: core24
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  adventure-mods:
    command: usr/bin/adventure-mods
    common-id: io.github.astrovm.AdventureMods
    extensions: [gnome]
    plugs:
      - home
      - network
      - removable-media
      - joystick
      - steam-config
      - steam-games

plugs:
  # Steam keeps its default library and Proton prefixes in hidden folders,
  # which the home interface leaves out. Each list covers the Debian and
  # Ubuntu package, every other native install, and the Flatpak. Libraries
  # anywhere else are picked through the file chooser portal.
  #
  # Read: the library list, the Proton each game uses, and the Proton
  # builds themselves, to check the game's one is installed and supported.
  steam-config:
    interface: personal-files
    read:
      - $HOME/.steam/debian-installation/config/config.vdf
      - $HOME/.steam/debian-installation/steamapps/libraryfolders.vdf
      - $HOME/.steam/debian-installation/steamapps/common
      - $HOME/.steam/debian-installation/compatibilitytools.d
      - $HOME/.local/share/Steam/config/config.vdf
      - $HOME/.local/share/Steam/steamapps/libraryfolders.vdf
      - $HOME/.local/share/Steam/steamapps/common
      - $HOME/.local/share/Steam/compatibilitytools.d
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/config/config.vdf
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/libraryfolders.vdf
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/common
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/compatibilitytools.d
  # Write: only the two games' folders and their Proton prefixes (71250 is
  # Sonic Adventure DX, 213610 is Sonic Adventure 2).
  steam-games:
    interface: personal-files
    write:
      - $HOME/.steam/debian-installation/steamapps/common/Sonic Adventure DX
      - $HOME/.steam/debian-installation/steamapps/common/Sonic Adventure 2
      - $HOME/.steam/debian-installation/steamapps/compatdata/71250
      - $HOME/.steam/debian-installation/steamapps/compatdata/213610
      - $HOME/.local/share/Steam/steamapps/common/Sonic Adventure DX
      - $HOME/.local/share/Steam/steamapps/common/Sonic Adventure 2
      - $HOME/.local/share/Steam/steamapps/compatdata/71250
      - $HOME/.local/share/Steam/steamapps/compatdata/213610
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/common/Sonic Adventure DX
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/common/Sonic Adventure 2
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/compatdata/71250
      - $HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/compatdata/213610

parts:
  tools:
    plugin: nil
    source: .
    build-packages: [build-essential, curl, xz-utils]
    override-build: |
      bash build-aux/build-tools.sh "$CRAFT_PART_INSTALL/usr/bin"

  adventure-mods:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - -Dprofile=default
      - -Dbuildtype=release
    build-packages:
      - curl
      - pkg-config
      - libudev-dev
      - gettext
      - desktop-file-utils
      - appstream
    # meson runs in its own shell after override-build, so rustup's folder
    # goes on PATH here rather than with an export.
    build-environment:
      - PATH: /root/.cargo/bin:${PATH}
    override-build: |
      craftctl set version="$(sh "$CRAFT_PART_SRC/build-aux/cargo-version.sh")"
      if ! command -v cargo >/dev/null; then
        curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --quiet --profile minimal
      fi
      craftctl default
    parse-info: [usr/share/metainfo/io.github.astrovm.AdventureMods.metainfo.xml]
