[package]
name = "adventure-mods"
version = "1.2.2"
edition = "2024"
license = "MIT"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
async-channel = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "7"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
gilrs = "0.11"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "rwh_06"] }

[dev-dependencies]
ctor = "1.0"
log = "0.4"
egui_kittest = "0.37"
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Tests capture `tracing` events through its `log` fallback; see src/test_log.rs.
tracing = { version = "0.1", features = ["log"] }

# Unoptimized, a screenshot takes most of a second to decode. Keep debug
# builds and tests usable.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
