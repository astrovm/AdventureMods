name: Format review fixes

on:
  push:
    branches: [agent/optimize-ui-animations]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and restore CI
        run: |
          cargo fmt
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/setup_page.rs .github/workflows/ci.yml
          git commit -m "Format UI review fixes"
          git push
