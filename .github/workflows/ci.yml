name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters are not evaluated for tag pushes (release CI still runs).
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

# One run per PR or branch; cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests that only touch docs or screenshots skip the build, test and
  # packaging jobs, and ones that don't touch the build skip packaging. Pushes,
  # tags and manual runs always run everything, so a merge still catches a
  # package a code change broke. To get packages for a branch, run CI on it by
  # hand (gh workflow run CI --ref <branch>).
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      packaging: ${{ steps.files.outputs.packaging }}
    steps:
      - name: Check whether code changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          printf '%s\n' "$files"
          code=false
          packaging=false
          while IFS= read -r file; do
            case "$file" in
              *.md | LICENSE | data/screenshots/*) ;;
              *) code=true ;;
            esac
            case "$file" in
              data/screenshots/*) ;;
              build-aux/* | data/* | .github/workflows/* | Cargo.toml | Cargo.lock | \
                build.rs | Makefile | meson.build | meson_options.txt | src/meson.build | \
                src/config.rs.in) packaging=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"
          echo "Build changed: $packaging"

  test:
    # Pull requests and release/manual runs validate the tree. A merge to main
    # does not need to repeat the PR validation that already required it.
    # x86 runs the same tests in the coverage job.
    name: test (ARM)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sh build-aux/ci-apt-install.sh libudev-dev libegl1 libgl1-mesa-dri libxkbcommon-x11-0 xvfb xauth

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      # nextest runs each test in its own process, so tests run in parallel
      # without sharing environment variables or other global state.
      - name: Run tests
        run: xvfb-run cargo nextest run --locked --all-targets --no-fail-fast

  translations:
    # The catalogs in po/ must match the text in the code. Reading Rust needs
    # GNU gettext 0.24 or newer, which Ubuntu does not have yet.
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    container:
      image: docker.io/library/archlinux:base

    steps:
      - name: Install gettext
        run: pacman -Syu --noconfirm --needed gettext git grep sed

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the catalogs are up to date
        run: |
          xgettext --version | head -n 1
          git config --global --add safe.directory "$PWD"
          sh build-aux/update-po.sh
          git diff --exit-code po/

      - name: Check the catalogs are valid
        run: |
          for po in po/*.po; do
            msgfmt --check --output-file=/dev/null "$po"
          done

  coverage:
    # Runs every test on x86 and requires 100% line coverage. Formatting,
    # clippy and the build script tests run here too.
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sh build-aux/ci-apt-install.sh libudev-dev libegl1 libgl1-mesa-dri libxkbcommon-x11-0 xvfb xauth

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check 100% line coverage
        run: xvfb-run cargo llvm-cov nextest --locked --workspace --all-targets --no-fail-fast --fail-under-lines 100 --show-missing-lines

      - name: Test build scripts
        run: |
          sh build-aux/test-cargo-test.sh
          sh build-aux/test-cargo-build.sh
          sh build-aux/test-cargo-version.sh
          sh build-aux/test-steam-manifest.sh

  flatpak:
    # Packaging starts right away instead of waiting for the test job; the
    # release job still requires tests to pass before anything is published.
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Cargo sources
        run: sh build-aux/flatpak/cargo-sources.sh

      - name: Validate manifest inputs
        run: |
          flatpak-builder --show-manifest build-aux/io.github.astrovm.AdventureMods.json >/dev/null
          flatpak-builder --show-manifest build-aux/io.github.astrovm.AdventureMods.Devel.json >/dev/null

      - name: Resolve release version
        id: version
        run: |
          version=$(sh build-aux/cargo-version.sh)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: build-aux/io.github.astrovm.AdventureMods.json
          arch: ${{ matrix.variant.arch }}
          build-dir: flatpak-production
          build-bundle: ${{ startsWith(github.ref, 'refs/tags/') }}
          bundle: AdventureMods-${{ steps.version.outputs.tag }}-${{ matrix.variant.arch }}.flatpak
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          upload-artifact: false
          run-tests: false
          cache-key: flatpak-production-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build-aux/**') }}

      - name: Verify packaged application
        run: >-
          build-aux/test-flatpak-package.sh
          flatpak-production
          io.github.astrovm.AdventureMods

      - name: Lint with Flathub's linter
        run: |
          lint="flatpak-builder-lint --exceptions --user-exceptions build-aux/flatpak/lint-exceptions.json"
          $lint manifest build-aux/io.github.astrovm.AdventureMods.json
          $lint builddir flatpak-production

      - name: Upload Flatpak artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdventureMods-${{ steps.version.outputs.tag }}-${{ matrix.variant.arch }}.flatpak
          path: AdventureMods-${{ steps.version.outputs.tag }}-${{ matrix.variant.arch }}.flatpak

  appimage:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64", "aarch64"]') }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuses crates compiled by earlier runs from GitHub's cache.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0

      # The same Ubuntu 24.04 container as `make appimage`.
      - name: Build AppImage
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: bash build-aux/appimage/build-container.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdventureMods-AppImage-${{ matrix.arch }}
          path: appimage-build/*.AppImage*

  snap:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64", "aarch64"]') }}
    # The snap's core24 base needs an Ubuntu 24.04 host to build without
    # snapcraft's LXD container, which took over four minutes to set up.
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0

      - name: Build Snap
        run: |
          sh build-aux/ci-apt-install.sh
          sudo snap install snapcraft --classic
          sudo env \
            RUSTC_WRAPPER="$SCCACHE_PATH" \
            SCCACHE_GHA_ENABLED=true \
            ACTIONS_CACHE_SERVICE_V2="$ACTIONS_CACHE_SERVICE_V2" \
            ACTIONS_RESULTS_URL="$ACTIONS_RESULTS_URL" \
            ACTIONS_RUNTIME_TOKEN="$ACTIONS_RUNTIME_TOKEN" \
            snapcraft pack --destructive-mode
          # Wait for the cache uploads, then show how many crates it reused.
          sudo "$SCCACHE_PATH" --stop-server

      - name: Install and test Snap
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          snap_file=$(echo adventure-mods_*.snap)
          unsquashfs -d snap-check "$snap_file"
          grep -Fx 'confinement: strict' snap-check/meta/snap.yaml
          test -x snap-check/usr/bin/7zz
          test -x snap-check/usr/bin/hpatchz
          sudo snap install --dangerous "$snap_file"
          version=$(sh build-aux/cargo-version.sh)
          snap run adventure-mods --version | grep -Fx "adventure-mods $version"
          snap connections adventure-mods
          mkdir -p snap-artifact
          cp "$snap_file" "snap-artifact/AdventureMods-v$version-$ARCH.snap"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AdventureMods-Snap-${{ matrix.arch }}
          path: snap-artifact/*.snap

  # The one check the ruleset requires: green when every job passed or was
  # skipped, red when any failed or was cancelled.
  ci:
    name: CI / Required
    if: always()
    needs: [changes, test, translations, coverage, flatpak, appimage, snap]
    runs-on: ubuntu-26.04
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # Create the draft release immediately on tag push (no build deps).
  # GitHub rejects GITHUB_TOKEN release creation when the tag commit's
  # .github/workflows tree differs from the default branch. Long package
  # jobs race with merges to main; creating the draft first freezes the
  # release before that can happen. Asset upload later only needs contents:write.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$RELEASE_TAG"
          version="${version#v}"
          cargo_version=$(sh build-aux/cargo-version.sh)

          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag version $version does not match Cargo.toml version $cargo_version"
            exit 1
          fi

          grep -Fq "<release version=\"$version\"" data/io.github.astrovm.AdventureMods.metainfo.xml.in

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, coverage, appimage, snap, flatpak, create-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AdventureMods-AppImage-*
          path: appimage-artifacts
          merge-multiple: true

      - name: Download Snap artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AdventureMods-Snap-*
          path: appimage-artifacts
          merge-multiple: true

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AdventureMods-*.flatpak
          path: flatpak-artifacts
          merge-multiple: true

      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          for arch in x86_64 aarch64; do
            for extension in AppImage AppImage.zsync snap; do
              test -f "appimage-artifacts/AdventureMods-$tag-$arch.$extension"
            done
            test -f "flatpak-artifacts/AdventureMods-$tag-$arch.flatpak"
          done
          test "$(find appimage-artifacts flatpak-artifacts -maxdepth 1 -type f | wc -l)" -eq 8
          gh release upload "$tag" \
            appimage-artifacts/*.AppImage* \
            appimage-artifacts/*.snap \
            flatpak-artifacts/*.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  publish-snap:
    # Uploads both snaps to the Snap Store's stable channel. The store holds
    # each upload for review first when the review queue says so.
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-26.04

    steps:
      - name: Download Snap artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AdventureMods-Snap-*
          path: snaps
          merge-multiple: true

      - name: Upload to the Snap Store
        env:
          # From `snapcraft export-login`, limited to uploading and
          # releasing adventure-mods to stable.
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS is required to upload the snaps"
            exit 1
          fi
          sudo snap install snapcraft --classic
          for arch in x86_64 aarch64; do
            status=0
            snapcraft upload --release=stable "snaps/AdventureMods-$RELEASE_TAG-$arch.snap" \
              >upload.log 2>&1 || status=$?
            cat upload.log
            # The store says it failed when it holds the upload for a review,
            # but the revision is in and gets released once approved.
            if [ "$status" -ne 0 ]; then
              if grep -q -e 'need manual review' -e 'complete their review process' upload.log; then
                echo "::notice::The $arch snap is uploaded and waiting for review in the Snap Store"
              else
                exit "$status"
              fi
            fi
          done

  publish-flatpak-repository:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-26.04

    steps:
      - name: Trigger Flatpak repository publication
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FLATPAK_REPO_TOKEN is required to publish the Flatpak repository"
            exit 1
          fi

          gh api \
            --method POST \
            repos/astrovm/flatpak/dispatches \
            -f event_type=publish-app \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$RELEASE_TAG"
