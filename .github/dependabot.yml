version: 2
updates:
  # Keeps the SHA-pinned actions (and their version comments) on the latest release.
  - package-ecosystem: github-actions
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Cargo.toml requirements and Cargo.lock.
  - package-ecosystem: cargo
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
